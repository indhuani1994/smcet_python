{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="text-center mb-5">
        <h1 class="text-primary">Contact Us</h1>
        <p class="lead">
            We'd love to hear from you.
        </p>
    </div>

    <div class="row">

        <!-- Contact Information -->

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="mb-4">Contact Information</h3>

                    <p>
                        📍 <strong>Address:</strong><br>
                        Madurai, Tamil Nadu
                    </p>

                    <p>
                        📞 <strong>Phone:</strong><br>
                        +91 98765 43210
                    </p>

                    <p>
                        📧 <strong>Email:</strong><br>
                        info@studentportal.com
                    </p>

                    <p>
                        🌐 <strong>Website:</strong><br>
                        www.studentportal.com
                    </p>

                </div>

            </div>

        </div>

        <!-- Contact Form -->

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="mb-4">Send Message</h3>

                    <form>

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter your name">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   class="form-control"
                                   placeholder="Enter your email">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Subject
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter subject">

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Message
                            </label>

                            <textarea class="form-control"
                                      rows="5"
                                      placeholder="Type your message"></textarea>

                        </div>

                        <button type="submit"
                                class="btn btn-primary">
                            Send Message
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
