{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3 class="text-center">
                        Student Registration Form
                    </h3>
                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">
                                Student Name
                            </label>

                            <input type="text"
                                   name="name"
                                   class="form-control"
                                   placeholder="Enter your name"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Department
                            </label>

                            <input type="text"
                                   name="department"
                                   class="form-control"
                                   placeholder="Enter department"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Enter email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Mobile Number
                            </label>

                            <input type="tel"
                                   name="mobile"
                                   class="form-control"
                                   placeholder="Enter mobile number"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Gender
                            </label>

                            <select name="gender"
                                    class="form-select">

                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>

                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Address
                            </label>

                            <textarea name="address"
                                      class="form-control"
                                      rows="4"
                                      placeholder="Enter address"></textarea>
                        </div>

                        <div class="text-center">

                            <button type="submit"
                                    class="btn btn-success">
                                Register
                            </button>

                            <button type="reset"
                                    class="btn btn-danger">
                                Clear
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
